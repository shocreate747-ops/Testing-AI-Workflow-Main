<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QC Review Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <header>
      <h1>QC Review Tracker</h1>
      <button id="refreshBtn" title="Refresh">↻</button>
    </header>

    <div id="status-bar">
      <span id="sync-label">Connecting…</span>
    </div>

    <div id="filter-bar">
      <div id="filter-search-wrap">
        <span id="filter-icon">⌕</span>
        <input id="filter-input" type="text" placeholder="Filter by editor…" autocomplete="off" />
        <button id="filter-clear" title="Clear">✕</button>
      </div>
      <div id="filter-dropdown" class="hidden"></div>
    </div>

    <div id="animation-list">
      <p class="placeholder">Loading animations…</p>
    </div>

  </div>

  <!--
    CSInterface.js is not included in this repo — copy it from Adobe's CEP Resources:
    https://github.com/Adobe-CEP/CEP-Resources/blob/master/CEP_11.x/CSInterface.js
    Place it at: adobe-plugin/js/CSInterface.js
  -->
  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
