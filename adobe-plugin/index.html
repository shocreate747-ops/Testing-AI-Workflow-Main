<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QC Review Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <header>
      <h1>QC Review Tracker</h1>
      <button id="refreshBtn" title="Refresh">↻</button>
    </header>

    <div id="status-bar">
      <span id="sync-label">Connecting…</span>
    </div>

    <div id="animation-list">
      <p class="placeholder">Loading animations…</p>
    </div>

  </div>

  <!--
    CSInterface.js is not included in this repo — copy it from Adobe's CEP Resources:
    https://github.com/Adobe-CEP/CEP-Resources/blob/master/CEP_11.x/CSInterface.js
    Place it at: adobe-plugin/js/CSInterface.js
  -->
  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
