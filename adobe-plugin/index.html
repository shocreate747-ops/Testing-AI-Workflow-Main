<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QC Review Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <header>
      <h1>QC Review Tracker</h1>
      <div class="header-actions">
        <button id="settingsBtn" title="Settings">⚙</button>
        <button id="refreshBtn" title="Refresh">↻</button>
      </div>
    </header>

    <div id="settings-panel" class="hidden">
      <label class="settings-label">Backend URL</label>
      <div class="settings-row">
        <input id="backend-url-input" type="text" placeholder="https://your-app.up.railway.app" autocomplete="off" />
        <button id="backend-url-save">Save</button>
      </div>
      <p id="backend-url-status"></p>

      <label class="settings-label" style="margin-top:10px">Google Sheet URL</label>
      <div class="settings-row">
        <input id="sheet-url-input" type="text" placeholder="Paste your Google Sheet URL…" autocomplete="off" />
        <button id="sheet-url-save">Save</button>
      </div>
      <p id="sheet-url-status"></p>
    </div>

    <div id="status-bar">
      <span id="sync-label">Connecting…</span>
    </div>

    <div id="filter-bar">
      <div id="filter-search-wrap">
        <span id="filter-icon">⌕</span>
        <input id="filter-input" type="text" placeholder="Filter by editor…" autocomplete="off" />
        <button id="filter-clear" title="Clear">✕</button>
      </div>
      <div id="filter-dropdown" class="hidden"></div>
    </div>

    <div id="animation-list">
      <p class="placeholder">Loading animations…</p>
    </div>

    <section id="render-section">
      <button id="renderBtn">Start Render</button>
      <span id="render-msg"></span>
    </section>

  </div>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
